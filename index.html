<body>

<div id="hud">

<div id="screen">
    <h1 id="screenTitle">THE BACKROOMS</h1>
    <p id="screenText">
        You are somewhere you should not be.<br>
        Find the exit. Something is hunting you.
    </p>
    <button id="startButton">ENTER THE BACKROOMS</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

/* =========================================
   ASSETS
   Add your files using these exact paths.
========================================= */

const ASSETS = {
    wall: "assets/textures/wall.jpeg",
    floor: "assets/textures/floor.jpeg",
    roof: "assets/textures/roof.jpeg",
    monster: "assets/models/Lonely_Wanderer.glb"
};

/* =========================================
   GRAPHICS
========================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x111109);

scene.fog = new THREE.FogExp2(
    0x111109,
    0.035
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    0.1,
    90
);

camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({
    antialias: false,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);

/* =========================================
   LIGHTING
========================================= */

scene.add(
    new THREE.HemisphereLight(
        0x77704b,
        0x10100a,
        0.3
    )
);

scene.add(
    new THREE.AmbientLight(
        0x77715a,
        0.15
    )
);

/* =========================================
   TEXTURES
   Procedural materials work as placeholders.
========================================= */

function makeNoiseTexture(base, speckle) {
    const canvas = document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx = canvas.getContext("2d");

    ctx.fillStyle = base;
    ctx.fillRect(0, 0, 256, 256);

    for (let i = 0; i < 1800; i++) {
        ctx.globalAlpha = Math.random() * 0.12;
        ctx.fillStyle = speckle;

        ctx.fillRect(
            Math.random() * 256,
            Math.random() * 256,
            2 + Math.random() * 3,
            2 + Math.random() * 3
        );
    }

    ctx.globalAlpha = 1;

    const texture = new THREE.CanvasTexture(canvas);

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    return texture;
}

const wallMaterial = new THREE.MeshStandardMaterial({
    map: makeNoiseTexture("#aaa16e", "#514b30"),
    roughness: 1
});

const floorMaterial = new THREE.MeshStandardMaterial({
    map: makeNoiseTexture("#625e43", "#b0a780"),
    roughness: 1
});

const roofMaterial = new THREE.MeshStandardMaterial({
    map: makeNoiseTexture("#797765", "#28281e"),
    roughness: 1
});

const textureLoader = new THREE.TextureLoader();
const gltfLoader = new GLTFLoader();

function loadTexture(path, material, repeatX, repeatY) {
    textureLoader.load(
        path,
        texture => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(repeatX, repeatY);

            material.map = texture;
            material.needsUpdate = true;
        },
        undefined,
        () => console.warn(
            "Using placeholder texture; file not found:",
            path
        )
    );
}

loadTexture(ASSETS.wall, wallMaterial, 1, 1);
loadTexture(ASSETS.floor, floorMaterial, 3, 3);
loadTexture(ASSETS.roof, roofMaterial, 2, 2);

/* =========================================
   GAME SETTINGS
========================================= */

const SIZE = 21;
const CELL = 4;
const WALL_HEIGHT = 3.5;

let maze = [];
let colliders = [];
let lights = [];
let exitDoor = null;
let monster = null;
let customMonster = null;

const player = {
    x: 0,
    z: 0,
    yaw: 0,
    pitch: 0,
    speed: 3.2,
    sprintSpeed: 5.2,
    stamina: 100
};

const keys = {};

let started = false;
let ended = false;
let locked = false;
let lastTime = 0;
let flickerTimer = 0;

/* =========================================
   MAZE GENERATION
========================================= */

function generateMaze() {
    maze = Array.from(
        { length: SIZE },
        () => Array(SIZE).fill(1)
    );

    const stack = [[1, 1]];

    maze[1][1] = 0;

    const directions = [
        [0, -2],
        [0, 2],
        [-2, 0],
        [2, 0]
    ];

    while (stack.length > 0) {
        const [x, z] = stack[stack.length - 1];

        const choices = directions.filter(([dx, dz]) => {
            const nx = x + dx;
            const nz = z + dz;

            return (
                nx > 0 &&
                nz > 0 &&
                nx < SIZE - 1 &&
                nz < SIZE - 1 &&
                maze[nz][nx] === 1
            );
        });

        if (choices.length === 0) {
            stack.pop();
            continue;
        }

        const [dx, dz] = choices[
            Math.floor(Math.random() * choices.length)
        ];

        maze[z + dz / 2][x + dx / 2] = 0;

        maze[z + dz][x + dx] = 0;

        stack.push([x + dx, z + dz]);
    }

    // Create a larger chamber around the exit.
    for (let z = SIZE - 4; z < SIZE - 1; z++) {
        for (let x = SIZE - 4; x < SIZE - 1; x++) {
            maze[z][x] = 0;
        }
    }
}

/* =========================================
   COLLISION
========================================= */

function blocked(x, z) {
    const offset = SIZE * CELL / 2;

    const gx = Math.floor((x + offset) / CELL);
    const gz = Math.floor((z + offset) / CELL);

    if (
        gx < 0 ||
        gz < 0 ||
        gx >= SIZE ||
        gz >= SIZE
    ) {
        return true;
    }

    return maze[gz][gx] === 1;
}

function movePlayer(dx, dz) {
    const radius = 0.28;

    if (!blocked(player.x + dx + Math.sign(dx) * radius, player.z)) {
        player.x += dx;
    }

    if (!blocked(player.x, player.z + dz + Math.sign(dz) * radius)) {
        player.z += dz;
    }
}

/* =========================================
   WORLD BUILDING
========================================= */

function clearWorld() {
    for (const object of [...scene.children]) {
        if (!object.isLight) {
            scene.remove(object);
        }
    }

    colliders = [];
    lights = [];
}

function buildWorld() {
    clearWorld();
    generateMaze();

    const offset = SIZE * CELL / 2;

    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(SIZE * CELL, SIZE * CELL),
        floorMaterial
    );

    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const roof = new THREE.Mesh(
        new THREE.PlaneGeometry(SIZE * CELL, SIZE * CELL),
        roofMaterial
    );

    roof.rotation.x = Math.PI / 2;
    roof.position.y = WALL_HEIGHT;

    scene.add(roof);

    const wallGeometry = new THREE.BoxGeometry(
        CELL,
        WALL_HEIGHT,
        CELL
    );

    const bulbMaterial = new THREE.MeshBasicMaterial({
        color: 0xc9bd83
    });

    for (let z = 0; z < SIZE; z++) {
        for (let x = 0; x < SIZE; x++) {
            const wx = x * CELL - offset + CELL / 2;
            const wz = z * CELL - offset + CELL / 2;

            if (maze[z][x] === 1) {
                const wall = new THREE.Mesh(
                    wallGeometry,
                    wallMaterial
                );

                wall.position.set(
                    wx,
                    WALL_HEIGHT / 2,
                    wz
                );

                scene.add(wall);

                colliders.push(wall);
            } else if (Math.random() < 0.08) {
                const light = new THREE.PointLight(
                    0xffdfa0,
                    0.8,
                    8,
                    2
                );

                light.position.set(
                    wx,
                    WALL_HEIGHT - 0.2,
                    wz
                );

                scene.add(light);
                lights.push(light);

                const bulb = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 0.04, 0.22),
                    bulbMaterial
                );

                bulb.position.copy(light.position);

                scene.add(bulb);
            }
        }
    }

    // Exit door.
    const exitX = (SIZE - 2) * CELL - offset + CELL / 2;
    const exitZ = (SIZE - 2) * CELL - offset + CELL / 2;

    exitDoor = new THREE.Group();

    exitDoor.position.set(exitX, 0, exitZ);

    const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x393426,
        roughness: 1
    });

    const doorMaterial = new THREE.MeshStandardMaterial({
        color: 0x15251a,
        emissive: 0x28502c,
        emissiveIntensity: 1
    });

    const left = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 2.8, 0.2),
        frameMaterial
    );

    left.position.set(-0.65, 1.4, 0);

    const right = left.clone();
    right.position.x = 0.65;

    const top = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.18, 0.2),
        frameMaterial
    );

    top.position.y = 2.8;

    const door = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 2.5, 0.1),
        doorMaterial
    );

    door.position.y = 1.25;

    exitDoor.add(left, right, top, door);

    scene.add(exitDoor);

    // Spawn player.
    player.x = -offset + CELL * 1.5;
    player.z = -offset + CELL * 1.5;

    player.yaw = 0;
    player.pitch = 0;

    camera.position.set(player.x, 1.65, player.z);
    camera.rotation.set(0, 0, 0);

    spawnMonster();
}

/* =========================================
   MONSTER
========================================= */

function createPlaceholderMonster() {
    const group = new THREE.Group();

    const darkMaterial = new THREE.MeshStandardMaterial({
        color: 0x11110f,
        roughness: 1
    });

    const headMaterial = new THREE.MeshStandardMaterial({
        color: 0x25251f,
        roughness: 1
    });

    const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.38, 1.0, 4, 8),
        darkMaterial
    );

    body.position.y = 1.2;

    group.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.29, 12, 10),
        headMaterial
    );

    head.position.y = 2.0;

    group.add(head);

    const eyeMaterial = new THREE.MeshBasicMaterial({
        color: 0xff170b
    });

    for (const x of [-0.11, 0.11]) {
        const eye = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 8, 8),
            eyeMaterial
        );

        eye.position.set(x, 2.03, -0.25);

        group.add(eye);
    }

    for (const x of [-0.3, 0.3]) {
        const leg = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.12, 0.7, 3, 6),
            darkMaterial
        );

        leg.position.set(x, 0.4, 0);

        group.add(leg);

        const arm = new THREE.Mesh(
            new THREE.CapsuleGeometry(0.1, 0.7, 3, 6),
            darkMaterial
        );

        arm.position.set(x * 1.5, 1.35, 0);

        group.add(arm);
    }

    return group;
}

function spawnMonster() {
    if (monster) {
        scene.remove(monster);
    }

    monster = customMonster
        ? customMonster.clone(true)
        : createPlaceholderMonster();

    const offset = SIZE * CELL / 2;

    monster.position.set(
        (SIZE - 3) * CELL - offset + CELL / 2,
        0,
        (SIZE - 3) * CELL - offset + CELL / 2
    );

    scene.add(monster);
}

async function loadMonster() {
    try {
        const gltf = await gltfLoader.loadAsync(ASSETS.monster);

        customMonster = gltf.scene;

        customMonster.scale.setScalar(1);

        if (started && !ended) {
            spawnMonster();
        }
    } catch (error) {
        console.warn(
            "Monster model not found. Using placeholder monster."
        );
    }
}

loadMonster();

/* =========================================
   MONSTER AI
========================================= */

function updateMonster(dt) {
    if (!monster) return;

    const dx = player.x - monster.position.x;
    const dz = player.z - monster.position.z;

    const distance = Math.hypot(dx, dz);

    const speed = 1.25 + Math.max(
        0,
        1 - distance / 15
    ) * 0.8;

    const step = speed * dt;

    const nx = monster.position.x +
        (dx / (distance || 1)) * step;

    const nz = monster.position.z +
        (dz / (distance || 1)) * step;

    if (!blocked(nx, monster.position.z)) {
        monster.position.x = nx;
    }

    if (!blocked(monster.position.x, nz)) {
        monster.position.z = nz;
    }

    monster.rotation.y = Math.atan2(dx, dz);

    monster.position.y = Math.sin(performance.now() * 0.006) * 0.035;

    if (distance < 1.15) {
        finishGame(false);
    }
}

/* =========================================
   GAME FLOW
========================================= */

function finishGame(victory) {
    if (ended) return;

    ended = true;
    started = false;

    document.exitPointerLock?.();

    document.getElementById("screenTitle").textContent =
        victory ? "YOU ESCAPED" : "IT FOUND YOU";

    document.getElementById("screenText").textContent =
        victory
            ? "You found the exit. For now."
            : "The halls fall silent. Try again.";

    document.getElementById("startButton").textContent =
        "PLAY AGAIN";

    document.getElementById("screen").classList.remove("hidden");
}

function startGame() {
    ended = false;
    started = true;

    player.stamina = 100;

    document.getElementById("screen").classList.add("hidden");

    buildWorld();

    renderer.domElement.requestPointerLock?.();
}

document.getElementById("startButton").addEventListener(
    "click",
    startGame
);

/* =========================================
   INPUT
========================================= */

document.addEventListener("pointerlockchange", () => {
    locked = document.pointerLockElement === renderer.domElement;
});

document.addEventListener("mousemove", event => {
    if (!started || !locked) return;

    player.yaw -= event.movementX * 0.002;

    player.pitch -= event.movementY * 0.002;

    player.pitch = Math.max(
        -1.4,
        Math.min(1.4, player.pitch)
    );

    camera.rotation.set(
        player.pitch,
        player.yaw,
        0,
        "YXZ"
    );
});

document.addEventListener("keydown", event => {
    keys[event.code] = true;
});

document.addEventListener("keyup", event => {
    keys[event.code] = false;
});

document.addEventListener("click", () => {
    if (started && !locked) {
        renderer.domElement.requestPointerLock?.();
    }
});

/* =========================================
   MAIN LOOP
========================================= */

function animate(time) {
    requestAnimationFrame(animate);

    const dt = Math.min(
        (time - lastTime) / 1000 || 0,
        0.04
    );

    lastTime = time;

    if (started && !ended) {
        let forward = 0;
        let sideways = 0;

        if (keys.KeyW) forward++;
        if (keys.KeyS) forward--;
        if (keys.KeyD) sideways++;
        if (keys.KeyA) sideways--;

        const moving = forward !== 0 || sideways !== 0;

        const sprinting =
            (keys.ShiftLeft || keys.ShiftRight) &&
            player.stamina > 0 &&
            moving;

        if (sprinting) {
            player.stamina = Math.max(
                0,
                player.stamina - 30 * dt
            );
        } else {
            player.stamina = Math.min(
                100,
                player.stamina + 18 * dt
            );
        }

        const speed = sprinting
            ? player.sprintSpeed
            : player.speed;

        const length = Math.hypot(
            forward,
            sideways
        ) || 1;

        forward /= length;
        sideways /= length;

        const dx = (
            Math.sin(player.yaw) * forward +
            Math.cos(player.yaw) * sideways
        ) * speed * dt;

        const dz = (
            Math.cos(player.yaw) * forward -
            Math.sin(player.yaw) * sideways
        ) * speed * dt;

        movePlayer(dx, dz);

        camera.position.set(
            player.x,
            1.65,
            player.z
        );

        camera.rotation.set(
            player.pitch,
            player.yaw,
            0,
            "YXZ"
        );

        // Occasional fluorescent light flicker.
        flickerTimer += dt;

        if (flickerTimer > 0.12) {
            flickerTimer = 0;

            for (const light of lights) {
                if (Math.random() < 0.025) {
                    light.intensity = 0.08;
                } else {
                    light.intensity = 0.8;
                }
            }
        }

        updateMonster(dt);

        document.getElementById("stamina").style.width =
            player.stamina + "%";

        if (
            exitDoor &&
            Math.hypot(
                player.x - exitDoor.position.x,
                player.z - exitDoor.position.z
            ) < 1.3
        ) {
            finishGame(true);
        }
    }

    renderer.render(scene, camera);
}

buildWorld();

requestAnimationFrame(animate);

/* =========================================
   RESIZE
========================================= */

window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio, 1.5)
    );
});
</script>

</body>
</html>
